# Render Blueprint: the scheduled trigger for the harvest.
#
# Workflows themselves cannot be declared here - Render's docs state Blueprints do not yet
# support creating or managing workflows, and Workflows has no native scheduling. The
# documented pattern is exactly this: a cron job that starts the workflow run. The Workflow
# service is created once in the dashboard against src/atl_transit/workflow.py; its tasks,
# retry policy and fan-out all live in code.
services:
  - type: cron
    name: atl-harvest-trigger
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m atl_transit.trigger
    plan: starter # `free` is not offered for cron jobs; billing is per-second.
    region: virginia # Render's closest region to Atlanta.

    # 07:00 UTC daily = 03:00 America/New_York. Render evaluates schedules in UTC only.
    schedule: "0 7 * * *"

    envVars:
      - key: ATL_STORE
        value: snowflake
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "FALSE"
      - key: SF_WAREHOUSE
        value: COMPUTE_WH
      - key: SF_DATABASE
        value: ATL
      - key: SF_SCHEMA
        value: PUBLIC
      - key: SF_ROLE
        value: ACCOUNTADMIN
      - key: SF_CORTEX_MODEL
        value: claude-sonnet-4-5
      # Slug of the deployed Workflow service. Unset means run the harvest inline instead.
      - key: RENDER_WORKFLOW_SLUG
        sync: false
      # `sync: false` makes Render prompt for these on first apply; they never enter the repo.
      - key: RENDER_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: SF_ACCOUNT
        sync: false
      - key: SF_USER
        sync: false
      - key: SF_PAT
        sync: false
