name: atl-transit
region: nyc

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: devfep/hack-renderatl-2026
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /list-apps
      initial_delay_seconds: 30
      period_seconds: 20
      failure_threshold: 5
    envs:
      # The agent reads Snowflake in the deployed app; DuckDB is for local work only.
      - key: ATL_STORE
        scope: RUN_TIME
        value: snowflake
      # Development burns the free-tier daily quota on flash-lite, so the deployed
      # app runs on a model whose 20-request allowance is untouched.
      - key: GEMINI_MODEL
        scope: RUN_TIME
        value: gemini-3.6-flash
      - key: GOOGLE_GENAI_USE_VERTEXAI
        scope: RUN_TIME
        value: "FALSE"
      - key: SF_WAREHOUSE
        scope: RUN_TIME
        value: COMPUTE_WH
      - key: SF_DATABASE
        scope: RUN_TIME
        value: ATL
      - key: SF_SCHEMA
        scope: RUN_TIME
        value: PUBLIC
      - key: SF_ROLE
        scope: RUN_TIME
        value: ACCOUNTADMIN
      - key: SF_CORTEX_MODEL
        scope: RUN_TIME
        value: claude-sonnet-4-5
      # Set with: doctl apps update <id> --spec .do/app.yaml after filling these in,
      # or in the dashboard. Never commit real values.
      - key: GOOGLE_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: SF_ACCOUNT
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: SF_USER
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: SF_PAT
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
